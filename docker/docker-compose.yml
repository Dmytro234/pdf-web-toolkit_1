version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: pdf-toolkit-backend
    env_file:
      - ../backend/.env
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      PORT: 5000
      TEMP_DIR: /app/.tmp
    volumes:
      - temp_data:/app/.tmp
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/v1/health || curl -fsS http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - internal

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: pdf-toolkit-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - internal

volumes:
  temp_data:

networks:
  internal:
    driver: bridge